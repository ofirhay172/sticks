<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>משחק קשים</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2e7d32;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 20px 10px;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  h2 {
    color: white;
    font-size: 28px;
    margin-bottom: 15px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }
  #topBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
    gap: 10px;
  }
  #playerTurn {
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
  button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #2e7d32;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: scale(0.95);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .stick {
    width: 16px;
    height: 70px;
    background: linear-gradient(to right, #d2b48c, #f5deb3, #d2b48c);
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
    transition: transform 0.15s, opacity 0.15s;
  }
  .stick:active {
    transform: scale(0.9);
  }
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  #winOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #winOverlay.show {
    display: flex;
  }
  #winBox {
    background: white;
    border-radius: 20px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #winBox h3 {
    font-size: 26px;
    color: #2e7d32;
    margin-bottom: 20px;
  }
  #winBox button {
    font-size: 18px;
    padding: 14px 30px;
    background: #2e7d32;
    color: white;
  }
</style>
</head>
<body>
<h2>🎯 משחק קשים</h2>
<div id="topBar">
  <button onclick="resetGame()">התחל מחדש</button>
  <div id="playerTurn"></div>
  <button onclick="endTurn()">סיים תור</button>
</div>
<div id="game"></div>

<div id="winOverlay">
  <div id="winBox">
    <h3 id="winMessage"></h3>
    <button onclick="resetGame()">שחק שוב</button>
  </div>
</div>

<script>
let rows = [7, 5, 3];
let currentRow = null;
let player = 1;

function render() {
  const game = document.getElementById('game');
  game.innerHTML = '';
  document.getElementById('playerTurn').innerText = '🎮 שחקן ' + player;

  rows.forEach((count, rowIndex) => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    for (let i = 0; i < count; i++) {
      const stick = document.createElement('div');
      stick.className = 'stick';
      stick.onclick = () => removeStick(rowIndex);
      rowDiv.appendChild(stick);
    }
    game.appendChild(rowDiv);
  });
}

function removeStick(rowIndex) {
  if (currentRow !== null && currentRow !== rowIndex) return;
  if (rows[rowIndex] === 0) return;
  currentRow = rowIndex;
  rows[rowIndex]--;

  if (rows.every(r => r === 0)) {
    let winner = player === 1 ? 2 : 1;
    render();
    showConfetti();
    setTimeout(() => showWin(winner), 500);
    return;
  }
  render();
}

function endTurn() {
  if (currentRow === null) return;

  if (rows.every(r => r === 0)) {
    let winner = player === 1 ? 2 : 1;
    showConfetti();
    setTimeout(() => showWin(winner), 500);
    return;
  }
  currentRow = null;
  player = player === 1 ? 2 : 1;
  render();
}

function showWin(winner) {
  document.getElementById('winMessage').innerText = '🏆 שחקן ' + winner + ' ניצח!';
  document.getElementById('winOverlay').classList.add('show');
}

function resetGame() {
  rows = [7, 5, 3];
  player = 1;
  currentRow = null;
  document.getElementById('winOverlay').classList.remove('show');
  render();
}

function showConfetti() {
  for (let i = 0; i < 80; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.background = 'hsl(' + Math.random() * 360 + ',100%,50%)';
    conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
    conf.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 4000);
  }
}

render();
</script>
</body>
</html>
