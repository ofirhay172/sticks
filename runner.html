<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>HTML Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px;
  }
  h2 {
    color: #e94560;
    margin-bottom: 15px;
    font-size: 24px;
  }
  #editor {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 600px;
    gap: 12px;
  }
  textarea {
    width: 100%;
    height: 55vh;
    background: #16213e;
    color: #0ff;
    border: 2px solid #0f3460;
    border-radius: 12px;
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
    resize: none;
    direction: ltr;
    text-align: left;
  }
  textarea::placeholder {
    color: #555;
  }
  textarea:focus {
    outline: none;
    border-color: #e94560;
  }
  .buttons {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  button {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
  #runBtn {
    background: #e94560;
    color: white;
  }
  #backBtn {
    background: #0f3460;
    color: white;
    display: none;
  }
  #clearBtn {
    background: #16213e;
    color: #888;
    border: 2px solid #0f3460;
  }
  #gameFrame {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    background: white;
    z-index: 100;
  }
  #backBtn.show {
    display: block;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    flex: none;
    padding: 10px 30px;
    opacity: 0.7;
    font-size: 14px;
  }
  #backBtn.show:active {
    transform: translateX(-50%) scale(0.95);
  }
  .hint {
    color: #555;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="editor">
  <h2>HTML Runner</h2>
  <textarea id="codeInput" placeholder="הדביקי כאן קוד HTML..." spellcheck="false"></textarea>
  <div class="buttons">
    <button id="runBtn" onclick="runCode()">הפעל</button>
    <button id="clearBtn" onclick="clearCode()">נקה</button>
  </div>
  <div class="hint">הדביקי קוד HTML של משחק ולחצי "הפעל"</div>
</div>

<iframe id="gameFrame" sandbox="allow-scripts allow-modals allow-popups"></iframe>
<button id="backBtn" onclick="goBack()">חזרה לעורך</button>

<script>
// Save/restore code from localStorage
const codeInput = document.getElementById('codeInput');
const saved = localStorage.getItem('lastCode');
if (saved) codeInput.value = saved;

function runCode() {
  const code = codeInput.value.trim();
  if (!code) return;

  localStorage.setItem('lastCode', code);

  const frame = document.getElementById('gameFrame');
  const editor = document.getElementById('editor');
  const backBtn = document.getElementById('backBtn');

  editor.style.display = 'none';
  frame.style.display = 'block';
  backBtn.classList.add('show');

  frame.srcdoc = code;
}

function goBack() {
  const frame = document.getElementById('gameFrame');
  const editor = document.getElementById('editor');
  const backBtn = document.getElementById('backBtn');

  frame.srcdoc = '';
  frame.style.display = 'none';
  backBtn.classList.remove('show');
  editor.style.display = 'flex';
}

function clearCode() {
  codeInput.value = '';
  localStorage.removeItem('lastCode');
}
</script>
</body>
</html>
